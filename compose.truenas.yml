# FSSDataHub — TrueNAS SCALE Custom App YAML
#
# Apps → Discover → Custom App → Install via YAML
# Delete any failed install first.
# Dataset must exist: /mnt/Seawolf/FogSignal/taxdata/sql
#
# Host port 3490 only. The 8080 on the right is inside the container
# and does not take the NAS app already on 8080.

x-notes: |
  # FSSDataHub

  Open http://NAS-IP:3490

  Database: /mnt/Seawolf/FogSignal/taxdata/sql/tax.db

x-portals:
  - host: 0.0.0.0
    name: Web UI
    path: /
    port: 3490
    scheme: http

x-metadata:
  title: FSSDataHub
  home: https://github.com/TalunJames/FSSDataHub
  icon: "https://cdn-icons-png.flaticon.com/512/17193/17193728.png"

services:
  collector:
    image: ghcr.io/talunjames/fssdatahub:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "3490:8080"
    environment:
      TAX_DATABASE_DATA: /data
      TZ: America/Los_Angeles
    volumes:
      - /mnt/Seawolf/FogSignal/taxdata/sql:/data
    labels:
      icon: "https://cdn-icons-png.flaticon.com/512/17193/17193728.png"
