name: Publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests/ -q

  docker:
    # The NAS pulls :latest with pull_policy always, so an image only ships
    # after the suite passes; the sha tag is the rollback handle.
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/talunjames/fssdatahub:latest
            ghcr.io/talunjames/fssdatahub:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/TalunJames/FSSDataHub
            org.opencontainers.image.title=FSSDataHub
          cache-from: type=gha
          cache-to: type=gha,mode=max
